<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PalmGrow Africa</title>
  <style>
    /* basic layout styles */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f6f8;
      color: #333;
    }
    .hidden {
      display: none;
    }
    .nav-item {
      display: flex;
      align-items: center;
      padding: 10px 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- AUTHENTICATION SCREEN -->
  <div id="authScreen">
    <h2>PalmGrow Login</h2>
    <!-- Login form elements -->
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="app" style="display: none;">
    <!-- SIDEBAR / NAVIGATION -->
    <nav id="sidebar">
      <div id="userAvatar"></div>
      <div id="userName">Member</div>
      <div id="userPhone"></div>
      <div>Referral Code: <span id="referralCode"></span></div>
      
      <hr />

      <div class="nav-item" id="dashboardNav" onclick="showPage('dashboard')">Dashboard</div>
      <div class="nav-item" id="employeeTasksNav" style="display: none;" onclick="showPage('tasks')">Employee Tasks</div>
      <div class="nav-item" id="employeePositionNav" style="display: none;" onclick="showPage('position')">Employee Position</div>
      <div class="nav-item" id="adminNav" style="display: none;" onclick="showPage('admin')">🛡️ Admin Panel</div>
    </nav>

    <!-- DASHBOARD VIEW -->
    <main id="mainContent">
      <div id="dashboardPage">
        <h3>Wallet Overview</h3>
        <p>Wallet Balance: <span id="walletBalanceDisplay">₦0.00</span></p>
        <p>Available Balance: <span id="availableBalance">₦0.00</span></p>
        <p>Total Investment: <span id="totalInvestment">₦0.00</span></p>
        <p>Total Earnings: <span id="totalEarnings">₦0.00</span></p>
        <p>Referral Earnings: <span id="referralEarnings">₦0.00</span></p>
        <p>Daily Rate: <span id="dailyRateDisplay">₦0.00 / day</span></p>
        <p>Position Wallet Balance: <span id="positionWalletBalance">₦0.00</span></p>
      </div>
    </main>
  </div>

  <!-- SUPABASE JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Helper function to select DOM elements
    const $ = (id) => document.getElementById(id);

    // Global Application State Variables
    let currentUser = null;
    let currentProfile = {};

    // Helper function for currency formatting
    function naira(amount) {
      const numericAmount = Number(amount) || 0;
      return "₦" + numericAmount.toLocaleString("en-NG", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // Navigation Helper
    function showPage(pageId) {
      console.log("Navigating to page:", pageId);
    }

    // Withdrawal Balance Helper Stub
    function updateWithdrawalBalance() {
      // Balance updates logic
    }

    /* ==========================================
       LOAD DASHBOARD FUNCTION
    ========================================== */
    async function loadDashboard() {
      const { data: { session }, error: sessionError } = await supabase.auth.getSession();

      if (sessionError) {
        console.error("Session error:", sessionError.message);
        return;
      }

      if (!session) return;

      currentUser = session.user;

      $("authScreen").style.display = "none";
      $("app").style.display = "block";

      // Load the complete profile instead of requesting selected columns.
      const { data: profile, error: profileError } = await supabase
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .maybeSingle();

      if (profileError) {
        console.error("Profile load error:", profileError.message);
        currentProfile = {};

        $("userName").textContent =
          currentUser.user_metadata?.full_name || "Member";

        $("adminNav").style.display = "none";

        alert("Unable to load your profile: " + profileError.message);
        return;
      }

      if (!profile) {
        console.error("No profile found for:", currentUser.id);
        currentProfile = {};
        $("adminNav").style.display = "none";
        alert("Your PalmGrow profile could not be found.");
        return;
      }

      currentProfile = profile;

      const name = profile.full_name ||
        currentUser.user_metadata?.full_name || "Member";

      $("userName").textContent = name;
      $("userPhone").textContent = profile.phone || "";
      $("userAvatar").textContent = name.charAt(0).toUpperCase();

      $("referralCode").textContent =
        profile.referral_code ||
        currentUser.id.replace(/-/g, "").slice(0, 8).toUpperCase();

      $("walletBalanceDisplay").textContent = naira(profile.available_balance);
      $("availableBalance").textContent = naira(profile.available_balance);
      $("totalInvestment").textContent = naira(profile.total_investment);
      $("totalEarnings").textContent = naira(profile.total_earnings);
      $("referralEarnings").textContent = naira(profile.referral_earnings);

      $("dailyRateDisplay").textContent =
        naira(profile.daily_payout_amount) + " / day";

      const accountType = String(profile.account_type || "").toLowerCase();
      const role = String(profile.role || "").toLowerCase();

      const isEmployee = accountType === "employee";
      const isAdmin = role === "admin";

      $("employeeTasksNav").style.display = isEmployee ? "flex" : "none";
      $("employeePositionNav").style.display = isEmployee ? "flex" : "none";

      // Display Admin Panel when the database profile confirms admin role.
      $("adminNav").style.display = isAdmin ? "flex" : "none";

      $("positionWalletBalance").textContent =
        naira(profile.available_balance);

      updateWithdrawalBalance();

      showPage("dashboard");

      console.log("PalmGrow profile loaded:", {
        userId: currentUser.id,
        role: profile.role,
        accountType: profile.account_type,
        isAdmin
      });
    }
  </script>
</body>
</html>
